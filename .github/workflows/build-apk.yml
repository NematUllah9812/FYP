name: Build TerraSteps Android APK & Run Tests

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:
    inputs:
      mapbox_public_token:
        description: "Optional Mapbox pk.* public token baked into --dart-define"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  build-apk:
    name: Flutter 3.27.4 Tests + Android APK
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Validate JSON Schema contracts
        run: |
          pip install --quiet jsonschema referencing
          python3 contracts/validate_contracts.py

      - name: Test Deliverable 1 package (terrasteps_gpx)
        working-directory: packages/terrasteps_gpx
        run: |
          dart pub get
          dart test

      - name: Test Deliverable 2 package (terrasteps_fitness)
        working-directory: packages/terrasteps_fitness
        run: |
          dart pub get
          dart test

      - name: Generate Android runner & patch Manifest + Gradle for Mapbox v11
        working-directory: apps/mobile
        run: |
          cp pubspec.yaml /tmp/pubspec.backup
          flutter create --platforms=android \
            --org io.terrasteps \
            --project-name terrasteps_mobile . 2>&1 | tail -20
          cp /tmp/pubspec.backup pubspec.yaml
          rm -f test/widget_test.dart
          bash ../../scripts/patch_android_manifest.sh

      - name: Resolve mobile dependencies, static analyze & smoke tests
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/pubget.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log
          flutter test

      - name: Build TerraSteps 30% Milestone ARM64 Release APK & Debug APK
        working-directory: apps/mobile
        env:
          MAPBOX_TOKEN: ${{ inputs.mapbox_public_token || vars.MAPBOX_ACCESS_TOKEN || '' }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --no-shrink \
            --dart-define=SUPABASE_URL=https://iaoqwxcyjkpvpqwoszih.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_sNduqq3F-AmpOI1olS2zkA_2zIouLeP \
            --dart-define=MAPBOX_ACCESS_TOKEN="${MAPBOX_TOKEN}" \
            2>&1 | tee /tmp/build.log

          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://iaoqwxcyjkpvpqwoszih.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_sNduqq3F-AmpOI1olS2zkA_2zIouLeP \
            --dart-define=MAPBOX_ACCESS_TOKEN="${MAPBOX_TOKEN}" \
            2>&1 | tee -a /tmp/build.log

      - name: Stage APKs into releases/ & dist-apk/
        run: |
          mkdir -p releases dist-apk
          cp apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             releases/terrasteps-milestone30-v0.3.0-arm64-v8a-release.apk
          cp apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist-apk/terrasteps-milestone30-v0.3.0-arm64-v8a-release.apk
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk \
             dist-apk/terrasteps-milestone30-v0.3.0-universal-debug.apk
          (cd releases && sha256sum *.apk > SHA256SUMS.txt)
          (cd dist-apk && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh releases/ dist-apk/

      - name: Commit arm64 APK to branch & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/terrasteps-milestone30-v0.3.0-arm64-v8a-release.apk releases/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): add compiled TerraSteps v0.3.0 arm64 APK [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

          gh release delete v0.3.0-milestone30 --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.3.0-milestone30 \
            dist-apk/terrasteps-milestone30-v0.3.0-arm64-v8a-release.apk \
            dist-apk/terrasteps-milestone30-v0.3.0-universal-debug.apk \
            dist-apk/SHA256SUMS.txt \
            --target "${{ github.ref_name }}" \
            --title "TerraSteps v0.3.0 — 30% FYP Milestone Android APKs" \
            --notes "Compiled automatically on GitHub Actions (Flutter 3.27.4, Mapbox SDK v11, Drift SQLite, H3 Res-9)."

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terrasteps-milestone30-apks
          path: dist-apk/*
          retention-days: 60
          if-no-files-found: error

      - name: Post failure diagnostics to PR #1 if build fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ CI Build Diagnostic Log (Run #${{ github.run_number }})"
            if [ -f /tmp/analyze.log ]; then
              echo "#### flutter analyze"
              echo '```'
              tail -50 /tmp/analyze.log
              echo '```'
            fi
            if [ -f /tmp/build.log ]; then
              echo "#### flutter build apk (tail)"
              echo '```'
              tail -80 /tmp/build.log
              echo '```'
            fi
          } > /tmp/pr_diag.md
          gh pr comment 1 --body-file /tmp/pr_diag.md || true
